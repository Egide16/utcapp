<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UTC Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="portal-container">
    <header>
      <h1>UTC Student Services Portal</h1>
      <p class="subtitle">Training &amp; Inspection Management</p>
    </header>

    <main>
      <div class="login-card">
        <h2>Sign In</h2>
        <form>
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username">

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password">

          <button type="submit">Log In</button>
        </form>
      </div>

      <div class="info-panel">
        <h3>Welcome</h3>
        <p>This portal provides access to training modules, inspection records, and reporting tools for staff and administrators.</p>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 UTC Student Portal. Infrastructure hosted on AWS.</p>
    </footer>
  </div>
</body>
</html>
